# Literature Baselines for SplitMNIST
# 
# This file contains baseline results from published continual learning papers
# for comparison with our experiments.
#
# Fields:
#   - paper_key: Short identifier for the paper
#   - protocol: Learning protocol (task-incremental-multihead, class-incremental, etc.)
#   - heads: multi or single
#   - epochs_per_task: Training epochs per task
#   - optimizer: Optimizer used
#   - reported_avg_acc: Average accuracy reported in the paper (null if not available)
#   - notes: Additional notes about the experiment setup

- paper_key: "Kirkpatrick2017_EWC"
  protocol: "task-incremental-multihead"
  heads: "multi"
  epochs_per_task: 5
  optimizer: "adam"
  reported_avg_acc: null
  notes: "Placeholder; fill from paper. EWC with Fisher information regularization."

